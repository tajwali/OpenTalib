version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: opentalib
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # In a real setup, we might want to initialize roles here via a script in docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opentalib"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotrue:
    image: supabase/gotrue:v2.161.0
    restart: always
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/opentalib?sslmode=disable
      GOTRUE_API_PORT: 9999
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      db:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: always
    environment:
      PGRST_DB_URI: postgres://postgres:${DB_PASSWORD}@db:5432/opentalib
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gotrue
      - postgrest

  kokoro-tts:
    image: python:3.11-slim
    volumes:
      - ./scripts/kokoro-server.py:/app/server.py
      - kokoro_models:/opt/kokoro-tts
    working_dir: /app
    command: >
      bash -c "
        apt-get update && apt-get install -y libsndfile1 espeak-ng &&
        pip install --quiet kokoro-onnx fastapi uvicorn soundfile huggingface-hub &&
        python3 -c \"from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='hexgrad/Kokoro-82M', filename='kokoro-v0_19.onnx', local_dir='/opt/kokoro-tts'); hf_hub_download(repo_id='hexgrad/Kokoro-82M', filename='voices-v1.0.bin', local_dir='/opt/kokoro-tts')\" &&
        cd /opt/kokoro-tts && uvicorn /app/server:app --host 0.0.0.0 --port 8880
      "
    ports:
      - "8880:8880"
    restart: unless-stopped

  opentalib:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      SUPABASE_URL: http://nginx:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_AUTH_URL: http://gotrue:9999
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/opentalib
      NODE_ENV: production
    volumes:
      - media_storage:/opt/opentalib/public/media
    depends_on:
      db:
        condition: service_healthy
      nginx:
        condition: service_started

volumes:
  db_data:
  media_storage:
  kokoro_models:
