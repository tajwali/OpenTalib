name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  check:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit Tests
        run: pnpm test
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E in CI
        run: |
          echo "E2E tests require a live Supabase instance and are skipped in CI."
          echo "Run locally with: pnpm exec playwright test"
